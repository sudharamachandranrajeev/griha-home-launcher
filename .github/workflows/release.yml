# Builds, signs and publishes Griha. Runs when a version tag such as v0.5.0 is pushed, or by hand
# (Actions, Release, Run workflow), which tags the chosen branch with the app's version itself.
# Notes come from release-notes/<version>.md, or the tag's message.
# The release key comes from repository secrets and is never committed:
#   GRIHA_KEYSTORE_BASE64   the .jks keystore, base64-encoded (base64 -w0 release.jks)
#   GRIHA_KEYSTORE_PASSWORD the keystore password
#   GRIHA_KEY_ALIAS         the key alias
#   GRIHA_KEY_PASSWORD      the key password
# Use the same key as the Griha already on your phone: Android only updates an app
# with an installer signed by the same key, and Griha's in-app updater checks it too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to release; it is tagged v<versionName>"
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; add the platform and build tools this app needs.
      - name: Install SDK 36
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Work out the version and tag
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; else TAG="v$NAME"; fi
          if [ "${TAG#v}" != "$NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME in app/build.gradle.kts"; exit 1
          fi
          if [ "${{ github.event_name }}" != "push" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG is already released; raise versionName first"; exit 1
          fi
          echo "VERSION=$NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.GRIHA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GRIHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GRIHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GRIHA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the GRIHA_KEYSTORE_BASE64, GRIHA_KEYSTORE_PASSWORD, GRIHA_KEY_ALIAS and GRIHA_KEY_PASSWORD repository secrets (Settings, Secrets and variables, Actions), then re-run this workflow."
            exit 1
          fi
          mkdir -p .signing
          echo "$KEYSTORE" | base64 -d > .signing/release.jks
          {
            echo "storeFile=.signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > .signing/release.properties

      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify the signature and name the installer
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "griha-launcher-$VERSION.apk"
          sha256sum "griha-launcher-$VERSION.apk" | tee checksum.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Griha $VERSION for Android 8.0 and later."
            echo
            if [ -f "release-notes/$VERSION.md" ]; then cat "release-notes/$VERSION.md"; else git tag -l --format='%(contents)' "$TAG"; fi
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat checksum.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" "griha-launcher-$VERSION.apk" --title "Griha $VERSION" --notes-file notes.md --target "$(git rev-parse HEAD)"

      - name: Remove the key
        if: always()
        run: rm -rf .signing
